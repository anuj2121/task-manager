<!DOCTYPE html>
<html>
<head>
    <title>Task Manager</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('bg1.jpg');
            background-size: cover;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 300px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4facfe;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #00c6ff;
        }

        a {
            display: block;
            margin-top: 10px;
            color: #007bff;
        }

        /* DASHBOARD */
        #dashboardSection {
            display: none;
            width: 100%;
            max-width: 800px;
        }

        .task {
            background: #eef2ff;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
        }
    </style>
</head>

<body>
<div id="messageBox" style="
    position: fixed;
    top: 20px;
    right: 20px;
    background: #4caf50;
    color: white;
    padding: 10px 15px;
    border-radius: 6px;
    display: none;
    z-index: 1000;
"></div>
<!-- 🔐 LOGIN -->
<div id="loginSection" class="card">
    <h2>Login</h2>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <a href="register.html">Create account</a>
</div>

<!-- 📊 DASHBOARD -->
<div id="dashboardSection" class="card">
    <h2>Dashboard</h2>

    <button onclick="logout()">Logout</button>
    <button onclick="loadTasks()">Load Tasks</button>

    <div id="taskList"></div>
</div>

<!-- 🔗 SCRIPT -->
<script src="script.js"></script>

</body>
</html>
